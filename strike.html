<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),E={};['hp','ammo','money','info','feed','msg','buy','hurt','ch','menu'].forEach(i=>E[i]=$(i));
const T=(k,s)=>{if(E[k]._t!==s)E[k].textContent=E[k]._t=s};
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,160);
scene.background=new THREE.Color(0xa9c6dc);scene.fog=new THREE.Fog(0xa9c6dc,40,130);camera.rotation.order='YXZ';scene.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true}),cv=renderer.domElement;
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(cv);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xffffff,0x776655,.95));const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(20,40,10);scene.add(sun);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshLambertMaterial({color:0xc4ae82}));fl.rotation.x=-Math.PI/2;scene.add(fl);
const gh=new THREE.GridHelper(120,60,0xa8935f,0xb59f6e);gh.position.y=.02;scene.add(gh);

// ---------- Dynamic Terrain & Height System ----------
const boxes=[],walls=[],platforms=[];
function box(x,z,w,d,h,c,yBase=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));
  m.position.set(x,yBase+h/2,z);scene.add(m);walls.push(m);boxes.push([x-w/2,x+w/2,z-d/2,z+d/2]);return m;
}
function pad(x,z,w,d,y,c){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,.1,d),new THREE.MeshLambertMaterial({color:c}));
  m.position.set(x,y,z);scene.add(m);platforms.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,y0:y,y1:y,axis:'none'});
}
function addRamp(x0,x1,z0,z1,y0,y1,axis){
  const steps=8,w=x1-x0,d=z1-z0;
  for(let i=0;i<steps;i++){
    const t0=i/steps,t1=(i+1)/steps,curY=y0+(y1-y0)*t1;
    let sx0=x0,sx1=x1,sz0=z0,sz1=z1;
    if(axis==='z'){sz0=z0+d*t0;sz1=z0+d*t1;}else{sx0=x0+w*t0;sx1=x0+w*t1;}
    box((sx0+sx1)/2,(sz0+sz1)/2,sx1-sx0,sz1-sz0,curY,0xd1b277);
  }
  platforms.push({x0,x1,z0,z1,y0,y1,axis});
}
function getGroundHeight(x,z){
  let gh=0;
  for(const p of platforms){
    if(x>=p.x0&&x<=p.x1&&z>=p.z0&&z<=p.z1){
      if(p.axis==='z'){const t=(z-p.z0)/(p.z1-p.z0);gh=Math.max(gh,p.y0+(p.y1-p.y0)*Math.max(0,Math.min(1,t)));}
      else if(p.axis==='x'){const t=(x-p.x0)/(p.x1-p.x0);gh=Math.max(gh,p.y0+(p.y1-p.y0)*Math.max(0,Math.min(1,t)));}
      else{gh=Math.max(gh,p.y0);}
    }
  }
  return gh;
}

// Map color palette
const WL=0xc9a96e,DV=0xb8955a,CR=0x8b5e34,DR=0x5c4033,ST=0xa38755;

// Outer Bounds Walls
[[0,-49.5,100,1,7,WL],[0,49.5,100,1,7,WL],[-49.5,0,1,100,7,WL],[49.5,0,1,100,7,WL]].forEach(a=>box(...a));

// Double Doors Helper
function makeDoors(x,z,w,d,angle,color=DR){
  box(x-w/4,z,w/2.2,d,4.5,color);
  box(x+w/4,z,w/2.2,d,4.5,color);
}

// ---------- Detailed Dust II Architecture ----------
// 1. Mid Doors & Mid Corridor
box(-10,-8,8,1,5,WL); box(10,-8,8,1,5,WL); // Mid door frame walls
makeDoors(0,-8,12,0.8,0.2);              // Mid Doors (Ajar)

// 2. Xbox & Catwalk Stairs / Catwalk (Elevated y=2.2)
box(-1,4,2.8,2.8,2.0,CR);                // Xbox
addRamp(2,8,2,6,0,2.2,'x');              // Stairs from Mid up to Catwalk
pad(14,-10,12,32,2.2,0xdcc790);           // Catwalk / Short A platform
box(8,-10,1,32,4,DV,2.2);                // Catwalk wall facing Mid
addRamp(14,20,-28,-24,2.2,1.4,'z');      // Catwalk Stairs down into A Site

// 3. A Site & Long A
pad(32,-36,24,20,1.4,0xdcc790);           // Elevated A Site Platform
box(32,-36,4,4,2.4,CR,1.4);              // A Site Default Plant Crate
box(43,-42,3,3,2.2,CR,1.4);              // Goose Crate
addRamp(40,44,-18,-26,0,1.4,'z');        // A Ramp from Long A up to A Site
box(40,12,3,5,1.6,0x6a7a5a);             // Long Car
box(22,12,1,40,6,DV);                    // Long Wall (separating Long from Mid)
makeDoors(34,26,10,1,0.4);               // Long Doors
box(28,26,4,1,6,WL); box(42,26,6,1,6,WL);// Long Doors Surround

// 4. B Tunnels (Upper & Lower)
pad(-36,20,20,28,2.4,0xd1b277);          // Upper B Tunnel Floor (Elevated y=2.4)
box(-46,20,1,28,6,ST,2.4);               // Tunnel Outer Wall
box(-26,20,1,28,6,ST,2.4);               // Tunnel Inner Wall
addRamp(-26,-10,10,14,2.4,0,'x');        // Lower B Tunnel Stairs down into Mid
makeDoors(-36,6,8,1,0);                  // B Tunnel Archway

// 5. B Site & B Doors
pad(-36,-36,22,22,1.0,0xdcc790);          // Elevated B Site Platform
box(-36,-36,4,4,2.4,CR,1.0);             // B Site Plant Boxes
makeDoors(-26,-26,8,1,0.3);              // B Doors (CT to B)
box(-26,-20,1,12,5,WL);                  // B Window Wall
box(-26,-20,2,4,2,CR,1.0);               // B Window Hole / Platform

// 6. CT Spawn & Slopes
pad(0,-40,30,14,0,0xaab4bd);              // CT Spawn Floor
addRamp(10,22,-40,-36,0,1.4,'x');        // CT Ramp up to A Site

// Wall Collision Physics
function push(p,r){for(const[b0,b1,c0,c1]of boxes){const cx=Math.max(b0,Math.min(p.x,b1)),cz=Math.max(c0,Math.min(p.z,c1)),dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);
 if(d<r){if(d>1e-4){p.x+=dx/d*(r-d);p.z+=dz/d*(r-d)}else{const l=p.x-b0,rr=b1-p.x,t=p.z-c0,bt=c1-p.z,m=Math.min(l,rr,t,bt);if(m===l)p.x=b0-r;else if(m===rr)p.x=b1+r;else if(m===t)p.z=c0-r;else p.z=c1+r}}}}

const loc=(x,z,y)=>{
  if(z>28)return'T Spawn';
  if(z<-24){if(x>18)return y>0.8?'A Site':'CT Slope';if(x<-18)return'B Site';return'CT Spawn';}
  if(x<-24){if(z>10)return'Upper Tunnels';if(z>-10)return'Lower Tunnels';return'B Outside';}
  if(x>26){if(z>20)return'Long Doors';if(z>-12)return'Long A';return'Long Pit';}
  if(x>6&&x<=24&&z<10&&z>-28)return y>1.2?'Short A / Catwalk':'Mid Connector';
  if(x>=-12&&x<=8)return z>8?'Top Mid':'Mid Street';
  return'Dust II';
};

// Bot Navmesh Nodes
const ND=[[-4,38],[34,34],[34,14],[34,-10],[34,-32],[-36,22],[-18,12],[2,12],[14,-2],[16,-20],[32,-36],[0,-4],[-2,-20],[-32,-32],[0,-38],[14,-38]];
const ADJ=ND.map(()=>[]);
[[0,1],[0,5],[0,6],[1,2],[2,3],[3,4],[5,6],[6,7],[7,8],[8,9],[9,10],[7,11],[11,12],[12,14],[12,13],[14,15],[15,4]].forEach(([a,b])=>{ADJ[a].push(b);ADJ[b].push(a)});
const TG=[4,10,12,9,13];
function route(b,to){const pv={[b.at]:-1},q=[b.at];
 for(let n;q.length&&(n=q.shift())!==to;)for(const m of ADJ[n])if(!(m in pv)){pv[m]=n;q.push(m)}
 const p=[];for(let n=to;n!==-1&&n in pv;n=pv[n])p.unshift(n);b.path=p.slice(1)}
function near(){let r=0,m=1e9;ND.forEach((n,i)=>{const d=Math.hypot(n[0]-camera.position.x,n[1]-camera.position.z);if(d<m){m=d;r=i}});return r}

let ac;function snd(f,d,v,t){if(!ac)return;const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(40,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}

// ---------- Guns & Weapons ----------
const G={};
[['usp','USP-S',0,35,.47,.91,4,12,24,.17,0,.014,.004,2.2,.35,0x2a2a2a,6.1,300,1],
 ['p250','P250',300,38,.64,.85,4,13,26,.15,0,.016,.005,2.2,.35,0x3a3a3a,6.1,300,1],
 ['deagle','Desert Eagle',700,53,.932,.81,3.9,7,35,.225,0,.05,.003,2.2,.4,0xb8a060,5.9,300,1],
 ['mp9','MP9',1250,26,.6,.87,4,30,120,.07,1,.012,.01,2.1,.5,0x2f3b4a,6,600,0],
 ['famas','FAMAS',2050,30,.7,.96,4,25,90,.09,1,.018,.011,3.3,.7,0x3d4a5c,5.6,300,0],
 ['m1s','M4A1-S',2900,38,.7,.99,3.48,20,60,.09,1,.016,.008,2.3,.75,0x4a4f55,5.7,300,0],
 ['m4','M4A4',3100,33,.7,.97,4,30,90,.09,1,.02,.01,3.1,.75,0x2a2f35,5.7,300,0],
 ['awp','AWP',4750,115,.975,.99,4,5,30,1.47,0,.06,.002,3.7,1.1,0x3d5a2a,5.1,100,0],
 ['ak','AK-47',0,36,.775,.98,4,30,90,.1,1,.022,.012,2.5,.75,0x5a3a1a,5.5,300,0]
].forEach(([k,n,p,dmg,pen,rng,hs,mag,res,rate,auto,rec,spr,rl,len,col,spd,kr,sec])=>G[k]={n,p,dmg,pen,rng,hs,mag,res,rate,auto,rec,spr,rl,len,col,spd,kr,sec});
const SHOP=['p250','deagle','mp9','famas','m1s','m4','awp','kev'];
const SHOPTXT='BUY (press number, B closes)\n'+SHOP.map((k,i)=>(i+1)+'  '+(k==='kev'?'Kevlar $650':G[k].n+' $'+G[k].p)).join('\n');
const gun=new THREE.Mesh(new THREE.BoxGeometry(.07,.1,1),new THREE.MeshLambertMaterial({color:0x2a2a2a}));camera.add(gun);
const rayS=new THREE.Raycaster(),rayL=new THREE.Raycaster(),sg=new THREE.SphereGeometry(.06,6,4),sm=new THREE.MeshBasicMaterial({color:0xffdd88}),K={};
let yaw=0,pitch=0,rk=0,spread=0,vx=0,vz=0,vy=0,py=0,ground=true,cd=0,rl=0,kick=0,hurt=0,trig=false,gunZ=-.5,scoped=false,buyOpen=false;
let hp=100,armor=0,money=800,cur='usp',inv,ammo,bots=[],sparks=[],phase='freeze',pt=10,round=1,wins=0,losses=0,locked=false,lostRound=true,sens=.002;
function zoom(){scoped=!scoped;camera.fov=scoped?25:75;camera.updateProjectionMatrix()}
function setGun(){const g=G[cur];gun.scale.z=g.len;gunZ=-.3-g.len/2;gun.material.color.setHex(g.col);gun.position.set(.22,-.2,gunZ);rl=0;if(scoped)zoom()}
function feed(t){const d=document.createElement('div');d.textContent=t;E.feed.prepend(d);setTimeout(()=>d.remove(),3500);if(E.feed.children.length>4)E.feed.lastChild.remove()}
function reload(){const g=G[cur],a=ammo[cur];if(rl>0||a.m>=g.mag||a.r<=0||hp<=0)return;rl=g.rl;snd(260,.1,.12,'square')}
function buy(i){const k=SHOP[i];if(phase!=='freeze'||hp<=0||!k)return;
 if(k==='kev'){if(armor>=100||money<650)return;armor=100;money-=650;return}
 const g=G[k];if(money<g.p||ammo[k])return;const s=g.sec?'sec':'pri';if(inv[s])delete ammo[inv[s]];
 inv[s]=k;ammo[k]={m:g.mag,r:g.res};cur=k;money-=g.p;setGun()}

// ---------- Bots Logic ----------
function makeBot(x,z){
 const g=new THREE.Group();g.rotation.order='YXZ';
 const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.45,.5),new THREE.MeshLambertMaterial({color:0x6b4a2f}));body.position.y=.72;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.24,10,8),new THREE.MeshLambertMaterial({color:0xe0b48a}));head.position.y=1.72;
 const gn=new THREE.Mesh(new THREE.BoxGeometry(.08,.1,.7),new THREE.MeshLambertMaterial({color:0x222222}));gn.position.set(.3,1.1,.45);
 g.add(body,head,gn);g.position.set(x,getGroundHeight(x,z),z);scene.add(g);
 const b={g,body,head,hp:100,armor:round>=2?100:0,helmet:round>=2,dead:false,dt:0,at:0,path:[],think:Math.random()*.2,seen:false,react:0,cd:0,sw:0,sd:0,st:0,lx:x,lz:z,dist:0};
 body.userData.b=head.userData.b=b;head.userData.head=true;return b}
const BOT_ACC=.3;
function hurtPlayer(d){if(hp<=0)return;if(armor>0){const h=d*G.ak.pen;armor=Math.max(0,armor-(d-h)*.5);d=h}hp-=d;hurt=1;snd(90,.15,.3,'triangle');if(hp<=0)endRound(false)}
function botShot(b){const d=b.dist;snd(150,.12,Math.max(.03,.22*(1-d/60)),'sawtooth');
 if(Math.random()<Math.max(.06,Math.min(BOT_ACC,.5-d*.012)))hurtPlayer(G.ak.dmg*Math.pow(G.ak.rng,d/12.7))}
function botAI(b,dt){
 const g=b.g,p=g.position;
 p.y=getGroundHeight(p.x,p.z);
 if(b.dead){b.dt+=dt;g.rotation.x=Math.max(-1.45,g.rotation.x-6*dt);return}
 if(phase!=='live')return;
 if((b.think-=dt)<=0){b.think=.2;const eye=new THREE.Vector3(p.x,p.y+1.6,p.z),d=camera.position.clone().sub(eye),dist=d.length();
  rayL.set(eye,d.normalize());rayL.far=dist;const s=hp>0&&dist<60&&!rayL.intersectObjects(walls).length;
  if(s&&!b.seen)b.react=.35+Math.random()*.4;b.seen=s;b.dist=dist}
 const dx=camera.position.x-p.x,dz=camera.position.z-p.z,l=Math.hypot(dx,dz)||1;
 if(b.seen){g.rotation.y=Math.atan2(dx,dz);
  if((b.sw-=dt)<=0){b.sw=.5+Math.random()*.9;b.sd=[-1,0,1][Math.random()*3|0]}
  p.x+=-dz/l*b.sd*2.6*dt;p.z+=dx/l*b.sd*2.6*dt;
  if(b.react>0)b.react-=dt;else if((b.cd-=dt)<=0){b.cd=.1+Math.random()*.25;botShot(b)}
 }else{
  if(!b.path.length)route(b,TG[Math.random()*TG.length|0]);
  const n=ND[b.path[0]];if(!n)return;
  const wx=n[0]-p.x,wz=n[1]-p.z,wl=Math.hypot(wx,wz);
  if(wl<1.5)b.at=b.path.shift();else{g.rotation.y=Math.atan2(wx,wz);p.x+=wx/wl*3.8*dt;p.z+=wz/wl*3.8*dt}
  if((b.st+=dt)>1){if(Math.hypot(p.x-b.lx,p.z-b.lz)<1)b.path=[];b.lx=p.x;b.lz=p.z;b.st=0}
 }
 push(p,.5)}

// ---------- Game Rounds ----------
function newRound(lost){
 bots.forEach(b=>scene.remove(b.g));bots=[];
 if(lost){inv={pri:null,sec:'usp'};ammo={usp:{m:12,r:24}};cur='usp';armor=0}
 else for(const k in ammo){ammo[k].m=G[k].mag;ammo[k].r=G[k].res}
 hp=100;camera.position.set(0,1.65,-38);yaw=Math.PI;pitch=rk=0;vx=vz=vy=py=0;ground=true;buyOpen=false;
 for(let i=0,n=Math.min(3+wins,8);i<n;i++)bots.push(makeBot(-12+i*4,38+(i%2)*2));
 phase='freeze';pt=10;setGun()}
function endRound(win){if(phase!=='live')return;phase='end';pt=3.5;lostRound=!win;if(win){wins++;money+=3250}else{losses++;money+=1400}}

// ---------- Shooting ----------
function tryFire(){
 if(hp<=0||cd>0||rl>0)return;const g=G[cur],a=ammo[cur];if(a.m<=0){reload();return}
 a.m--;cd=g.rate;kick=1;camera.rotation.set(pitch+rk,yaw,0);scene.updateMatrixWorld();
 const sp=g.spr+spread+Math.hypot(vx,vz)*.004+(py>getGroundHeight(camera.position.x,camera.position.z)?.03:0)+(cur==='awp'&&!scoped?.07:0),d=new THREE.Vector3();camera.getWorldDirection(d);
 const r=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion),u=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
 d.addScaledVector(r,(Math.random()-.5)*2*sp).addScaledVector(u,(Math.random()-.5)*2*sp).normalize();rayS.set(camera.position,d);
 const wh=rayS.intersectObjects(walls)[0],bh=rayS.intersectObjects(bots.filter(b=>!b.dead).flatMap(b=>[b.body,b.head]))[0];
 if(bh&&(!wh||bh.distance<wh.distance)){
  const b=bh.object.userData.b,hs=bh.object.userData.head;
  let dmg=g.dmg*Math.pow(g.rng,bh.distance/12.7),prot=b.armor>0;
  if(hs){dmg*=g.hs;prot=prot&&b.helmet}
  else if(bh.point.y<b.g.position.y+.7){dmg*=.75;prot=false}
  else if(bh.point.y<b.g.position.y+1.05)dmg*=1.25;
  if(prot){const h=dmg*g.pen;b.armor=Math.max(0,b.armor-(dmg-h)*.5);dmg=h}
  b.hp-=dmg;E.ch.classList.add('hit');setTimeout(()=>E.ch.classList.remove('hit'),90);route(b,near());
  if(b.hp<=0&&!b.dead){b.dead=true;b.dt=0;money+=g.kr;feed((hs?'Headshot! ':'Kill ')+'+$'+g.kr)}
  else if(hs&&prot)feed('Helmet absorbed the hit');
 }else if(wh){const m=new THREE.Mesh(sg,sm);m.position.copy(wh.point);scene.add(m);sparks.push({m,t:.25})}
 rk+=g.rec*.6;pitch+=g.rec*.4;yaw+=(Math.random()-.5)*g.rec*.5;spread=Math.min(.05,spread+g.spr*.7);snd(200,.12,.25,'sawtooth')}

// ---------- Frame Loop ----------
function update(dt){
 const alive=hp>0,g=G[cur];
 const gh=getGroundHeight(camera.position.x,camera.position.z);
 if(alive){
  const f=(K.KeyW?1:0)-(K.KeyS?1:0),s=(K.KeyD?1:0)-(K.KeyA?1:0),l=Math.hypot(f,s)||1,sp=K.ShiftLeft?g.spd*.5:g.spd;
  const wx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)/l*sp,wz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)/l*sp,k=1-Math.exp((ground?14:2.5)*-dt);
  vx+=(wx-vx)*k;vz+=(wz-vz)*k;camera.position.x+=vx*dt;camera.position.z+=vz*dt;push(camera.position,.4);
  if(K.Space&&ground){vy=5.6;ground=false}
  vy-=16*dt;py+=vy*dt;
  if(py<=gh){py=gh;vy=0;ground=true}
  camera.position.y=1.65+py;
 }else camera.position.y=Math.max(.35,camera.position.y-3*dt);
 camera.rotation.set(pitch+rk,yaw,0);
 cd-=dt;kick=Math.max(0,kick-8*dt);hurt=Math.max(0,hurt-1.5*dt);rk*=Math.exp(-9*dt);spread*=Math.exp(-6*dt);
 if(rl>0){rl-=dt;if(rl<=0){rl=0;const a=ammo[cur],n=Math.min(g.mag-a.m,a.r);a.m+=n;a.r-=n}}
 if(alive&&trig&&g.auto)tryFire();
 gun.position.z=gunZ+kick*.06;
 bots.forEach(b=>botAI(b,dt));bots.forEach(b=>{if(b.dead&&b.dt>5)scene.remove(b.g)});
 sparks=sparks.filter(s=>{if((s.t-=dt)>0)return true;scene.remove(s.m);return false});
 if(phase==='freeze'){pt-=dt;if(pt<=0){phase='live';buyOpen=false}}
 else if(phase==='live'){if(bots.every(b=>b.dead))endRound(true)}
 else{pt-=dt;if(pt<=0){round++;newRound(lostRound)}}
 money=Math.min(money,16000);
 const am=ammo[cur],left=bots.filter(b=>!b.dead).length;
 T('hp','HP '+Math.ceil(Math.max(0,hp))+'    ARMOR '+Math.ceil(armor));
 T('ammo',g.n+(rl>0?'  (reloading)':'')+'\n'+am.m+' / '+am.r);T('money','$'+money);
 T('info','Round '+round+'  ·  Wins '+wins+' – Losses '+losses+'\nTerrorists left: '+left+(round>=2?'  (armored)':'')+'\n'+loc(camera.position.x,camera.position.z,py));
 T('buy',phase==='freeze'?(buyOpen?SHOPTXT:'Warm-up '+Math.ceil(pt)+'s — press B to buy'):'');
 T('msg',phase==='end'?(hp<=0?'YOU DIED':'ROUND WON'):'');
 E.hurt.style.opacity=hurt;E.ch.style.setProperty('--g',(4+(spread+Math.hypot(vx,vz)*.004+(py>gh?.03:0))*450|0)+'px')}

// ---------- Controls ----------
const sl=$('sens');try{sl.value=localStorage.getItem('strikeSens')||4}catch(e){}
const setSens=()=>{sens=sl.value*.0005;try{localStorage.setItem('strikeSens',sl.value)}catch(e){}};sl.oninput=setSens;setSens();
$('play').onclick=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();cv.requestPointerLock()};
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cv;E.menu.style.display=locked?'none':'flex';trig=false;for(const k in K)K[k]=0});
addEventListener('mousemove',e=>{if(!locked||hp<=0)return;const z=scoped?.3:1;yaw-=e.movementX*sens*z;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*sens*z))});
addEventListener('mousedown',e=>{if(!locked)return;if(e.button===2){if(cur==='awp')zoom();return}if(e.button)return;trig=true;tryFire()});
addEventListener('mouseup',()=>trig=false);addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(!locked)return;K[e.code]=1;if(e.code==='Space')e.preventDefault();
 if(e.code==='KeyR')reload();
 else if(e.code==='KeyB'){if(phase==='freeze')buyOpen=!buyOpen}
 else if(/^Digit[1-8]$/.test(e.code)){const n=+e.code[5];
  if(buyOpen)buy(n-1);else if(n===1&&inv.pri){cur=inv.pri;setGun()}else if(n===2){cur=inv.sec;setGun()}}});
addEventListener('keyup',e=>K[e.code]=0);

newRound(true);let prev=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;if(locked)update(dt);renderer.render(scene,camera)}
requestAnimationFrame(loop);
</script></body></html>
